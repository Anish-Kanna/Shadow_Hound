title: Credential Dumping Detection
description: |
  Hunt for adversaries attempting to extract credentials from Windows systems.
  Covers LSASS memory dumping, SAM database access, NTDS.dit extraction,
  and credential access via common tools (Mimikatz, ProcDump, comsvcs.dll).
author: ShadowHound Playbook Library
created: 2024-01-01
version: "1.3"

tactics:
  - Credential Access

tags:
  - attack.t1003
  - attack.t1003.001
  - attack.t1003.002
  - attack.t1003.003
  - attack.ta0006
  - credential_dumping
  - lsass
  - mimikatz
  - windows

mitre_attack:
  tactics:
    - id: TA0006
      name: Credential Access
  techniques:
    - id: T1003.001
      name: OS Credential Dumping - LSASS Memory
    - id: T1003.002
      name: OS Credential Dumping - Security Account Manager
    - id: T1003.003
      name: OS Credential Dumping - NTDS

severity: critical

data_sources:
  - Sysmon Event ID 10 (Process Access to LSASS)
  - Windows Security Event 4656 (Handle to SAM)
  - Windows Security Event 4663 (File access to NTDS.dit)
  - EDR memory access telemetry
  - File creation events

ioc_patterns:
  processes:
    - procdump.exe with lsass target
    - comsvcs.dll MiniDump via rundll32
    - Any process opening LSASS with PROCESS_VM_READ
    - ntdsutil.exe
    - vssadmin.exe creating shadow copy
    - wmic shadowcopy call create
  file_artifacts:
    - lsass.dmp in any location
    - "*.dmp files created by system processes"
    - ntds.dit copied outside of %SystemRoot%
    - SYSTEM and SAM registry hive exports
  command_line_patterns:
    - "procdump -ma lsass"
    - "rundll32 comsvcs.dll, MiniDump"
    - "ntdsutil snapshot"
    - "vssadmin create shadow"
    - "reg save HKLM\\SAM"
    - "sekurlsa::"
    - "lsadump::"

query_templates:
  splunk:
    lsass_access_sysmon: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=10
      earliest=-7d
      TargetImage="*lsass.exe"
      NOT (SourceImage="*MsMpEng.exe" OR SourceImage="*CylanceSvc.exe"
           OR SourceImage="*CSFalconService.exe" OR SourceImage="*SentinelAgent.exe"
           OR SourceImage="*svchost.exe" OR SourceImage="*werfault.exe")
      | table _time, Computer, SourceImage, SourceUser, TargetImage, GrantedAccess, CallTrace
      | sort -_time
      | head 500

    procdump_usage: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1
      earliest=-7d
      (Image="*procdump*" OR CommandLine="*lsass*" OR CommandLine="*-ma*lsass*")
      | table _time, Computer, User, Image, CommandLine, ParentImage
      | sort -_time
      | head 500

    comsvcs_minidump: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1
      earliest=-7d
      CommandLine="*comsvcs*" CommandLine="*MiniDump*"
      | table _time, Computer, User, CommandLine, ParentCommandLine
      | sort -_time
      | head 200

    sam_registry_access: |
      search index=* (sourcetype=WinEventLog:Security)
      earliest=-7d
      (EventCode=4656 OR EventCode=4663)
      ObjectName="*\\SAM" OR ObjectName="*\\SECURITY" OR ObjectName="*ntds.dit"
      NOT SubjectUserName="*$"
      | table _time, Computer, SubjectUserName, ObjectName, AccessMask, ProcessName
      | sort -_time
      | head 500

    ntds_extraction: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
      earliest=-7d
      (EventCode=11 OR EventCode=1)
      (TargetFilename="*ntds.dit" OR CommandLine="*ntdsutil*" OR CommandLine="*vssadmin*create*shadow*")
      | table _time, Computer, User, EventCode, TargetFilename, Image, CommandLine
      | sort -_time
      | head 500

  kql_defender: |
    let lsass_access = DeviceEvents
    | where Timestamp >= ago(7d)
    | where ActionType == "OpenProcessApiCall"
    | where FileName =~ "lsass.exe"
    | where not (InitiatingProcessFileName has_any ("MsMpEng.exe", "svchost.exe",
        "csrss.exe", "werfault.exe", "taskmgr.exe"))
    | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName,
              InitiatingProcessCommandLine, ActionType;
    let dump_files = DeviceFileEvents
    | where Timestamp >= ago(7d)
    | where FileName endswith ".dmp"
    | where InitiatingProcessFileName !in~ ("werfault.exe", "WerFaultSecure.exe")
    | project Timestamp, DeviceName, AccountName, FileName, FolderPath,
              InitiatingProcessFileName, InitiatingProcessCommandLine;
    lsass_access
    | union dump_files
    | order by Timestamp desc
    | limit 1000

escalation_thresholds:
  immediate_escalation:
    - lsass.dmp file created on any host
    - NTDS.dit accessed outside of backup process
    - SAM and SYSTEM hive exported simultaneously
    - Mimikatz command strings detected in command line
  investigate_further:
    - procdump.exe executed without lsass as target
    - VSS shadow copy created (could be legitimate backup)

response_actions:
  - Immediately isolate affected system
  - Assume all credentials on the system are compromised
  - Force password reset for all accounts that logged into the system in the past 90 days
  - If DC: initiate krbtgt password rotation procedure
  - Preserve memory image if possible
  - Scan all systems for the presence of Mimikatz signatures

references:
  - https://attack.mitre.org/techniques/T1003/
  - https://github.com/gentilkiwi/mimikatz
  - https://docs.microsoft.com/en-us/sysinternals/downloads/procdump
