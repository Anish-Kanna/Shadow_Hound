title: WMI Lateral Movement Detection
description: |
  Hunt for adversaries using Windows Management Instrumentation (WMI) to
  execute code on remote systems. WMI lateral movement is commonly used by
  threat actors including APT29, Lazarus Group, and FIN7.
author: ShadowHound Playbook Library
created: 2024-01-01
version: "1.2"

tactics:
  - Lateral Movement
  - Execution

tags:
  - attack.t1047
  - attack.ta0008
  - attack.ta0002
  - wmi
  - lateral_movement
  - windows

mitre_attack:
  tactics:
    - id: TA0008
      name: Lateral Movement
    - id: TA0002
      name: Execution
  techniques:
    - id: T1047
      name: Windows Management Instrumentation
    - id: T1021.006
      name: Remote Services - Windows Remote Management

severity: high

data_sources:
  - Windows Event Logs (Security, System, WMI-Activity)
  - Sysmon (Event IDs 1, 3, 19, 20, 21)
  - EDR process telemetry
  - Network flow logs

ioc_patterns:
  processes:
    - wmiprvse.exe spawning cmd.exe or powershell.exe
    - wmic.exe with remote host arguments
    - scrcons.exe (WMI script consumer)
  command_line_patterns:
    - "wmic /node: process call create"
    - "wmic /node: os get"
    - "Invoke-WMIMethod"
    - "Get-WMIObject"
    - "winrm"
  network:
    - TCP port 135 (RPC endpoint mapper)
    - TCP port 49152-65535 (RPC dynamic)
    - TCP port 5985/5986 (WinRM HTTP/HTTPS)
  registry:
    - "HKLM\\SOFTWARE\\Microsoft\\WBEM"
    - WMI subscription entries in root\subscription namespace

query_templates:
  splunk:
    wmi_process_spawn: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1
      earliest=-7d
      ParentImage="*wmiprvse.exe"
      (Image="*cmd.exe" OR Image="*powershell.exe" OR Image="*wscript.exe" OR Image="*cscript.exe")
      | table _time, Computer, User, Image, CommandLine, ParentImage, ParentCommandLine
      | sort -_time
      | head 1000

    wmic_remote_exec: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1
      earliest=-7d
      Image="*wmic.exe"
      CommandLine="*/node:*"
      | table _time, Computer, User, CommandLine, ParentImage
      | sort -_time
      | head 1000

    wmi_subscriptions: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational
      earliest=-7d
      (EventCode=19 OR EventCode=20 OR EventCode=21)
      | table _time, Computer, User, EventCode, Name, Query, Destination
      | sort -_time
      | head 1000

    network_rpc: |
      search index=* sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=3
      earliest=-7d
      (DestinationPort=135 OR DestinationPort=5985 OR DestinationPort=5986)
      NOT (SourceIp=DestinationIp)
      | stats count by SourceIp, DestinationIp, DestinationPort, Image
      | where count > 3
      | sort -count
      | head 500

  kql_defender: |
    DeviceProcessEvents
    | where Timestamp >= ago(7d)
    | where InitiatingProcessFileName =~ "wmiprvse.exe"
    | where FileName in~ ("cmd.exe", "powershell.exe", "wscript.exe", "cscript.exe", "mshta.exe")
    | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine,
              InitiatingProcessFileName, InitiatingProcessCommandLine
    | order by Timestamp desc
    | limit 1000

  kql_sentinel: |
    DeviceNetworkEvents
    | where Timestamp >= ago(7d)
    | where RemotePort in (135, 5985, 5986)
    | where InitiatingProcessFileName =~ "wmic.exe" or InitiatingProcessFileName =~ "wmiprvse.exe"
    | summarize
        ConnectionCount = count(),
        Targets = make_set(RemoteIP),
        FirstSeen = min(Timestamp),
        LastSeen = max(Timestamp)
        by DeviceName, AccountName, InitiatingProcessFileName, RemotePort
    | where array_length(Targets) > 1
    | order by ConnectionCount desc
    | limit 500

escalation_thresholds:
  immediate_escalation:
    - wmiprvse.exe spawning powershell with encoded command AND outbound network to new external IP
    - WMI subscription created outside of change window
    - wmic.exe connecting to >5 unique internal hosts within 1 hour
  investigate_further:
    - Single WMI process spawn without network activity
    - wmic.exe usage from known admin workstations during business hours

response_actions:
  - Isolate affected endpoint from network
  - Collect full process memory from wmiprvse.exe
  - Export WMI subscription namespace: root\subscription
  - Pull Sysmon event log (Event IDs 1,3,7,19,20,21) for past 30 days
  - Check for persistence via WMI subscriptions on all domain controllers
  - Review scheduled tasks and services on affected hosts

references:
  - https://attack.mitre.org/techniques/T1047/
  - https://github.com/Neo23x0/sigma/blob/master/rules/windows/process_creation/win_wmiprvse_spawning_process.yml
  - https://www.fireeye.com/blog/threat-research/2020/07/thinking-about-defenders.html
